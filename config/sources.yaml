# ── Liste noire ────────────────────────────────────────────────
# Sites d'agrégation et comparatifs commerciaux : jamais cités comme source
# primaire. Utilisables uniquement pour repérer un sujet, à condition de
# remonter ensuite à la source d'origine.
liste_noire:
  - comparatifs iPaaS publiés par un éditeur d'iPaaS
  - blogs "top 10 des meilleurs outils X"
  - reprises de communiqué sans valeur ajoutée

# ── Recherche ouverte ──────────────────────────────────────────
# Le registre ne suffit pas : il ne trouve que ce qu'on sait déjà chercher.
# Compléter chaque passe par des requêtes ouvertes pour attraper les acteurs
# absents du registre. Tout nouvel acteur pertinent est proposé à l'ajout.
recherche_ouverte:
  requetes:
    - "agentic AI enterprise deployment"
    - "MCP server production"
    - "AI gateway governance"
    - "iPaaS agentic"
    - "levée de fonds IA France"
  regle: >
    Si un sujet remonte uniquement par recherche ouverte et provient d'un
    acteur absent du registre, l'ajouter en proposition dans le rapport de
    passe plutôt que de l'insérer silencieusement.
