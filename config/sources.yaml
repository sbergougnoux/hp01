      - { nom: Spécification MCP,     url: "https://modelcontextprotocol.io",             tier: 1, feed: "?" }
      - { nom: MCP GitHub (releases), url: "https://github.com/modelcontextprotocol",     tier: 1, feed: "?" }
      - { nom: Agentic AI Foundation, url: "?",                                           tier: 1, feed: "?" }
      - { nom: A2A / Linux Foundation,url: "?",                                           tier: 1, feed: "?" }
