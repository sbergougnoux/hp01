# Registre des sources — H0RS-P1STE
#
# tier 1 = source primaire (éditeur, mainteneur, communiqué). Toujours dépouillée.
# tier 2 = source secondaire de qualité (presse tech, analyste). Dépouillée si tier 1 muet.
# tier 3 = signal faible / communauté. Échantillonnée, jamais citée seule.
#
# feed: URL du flux RSS/Atom. "?" = à vérifier au moment de l'implémentation,
#       ne pas inventer : si le flux n'existe pas, passer en mode "scrape" ou "search".
# cadence: hebdo | quotidien | mensuel
#
# Les URL de flux ci-dessous doivent être testées une par une avant mise en service.
# Celles marquées "?" n'ont PAS été vérifiées.

meta:
  version: 1
  langue_sortie: fr
  derniere_revue: 2026-08-28

balises:

  # ── B1 · Fournisseurs de modèles ──────────────────────────────
  - id: b1
    nom: Fournisseurs de modèles
    cadence: quotidien
    sources:
      - { nom: Anthropic News,        url: "https://www.anthropic.com/news",              tier: 1, feed: "?" }
      - { nom: Anthropic Engineering, url: "https://www.anthropic.com/engineering",       tier: 1, feed: "?" }
      - { nom: OpenAI Blog,           url: "https://openai.com/blog",                     tier: 1, feed: "?" }
      - { nom: Google DeepMind Blog,  url: "https://deepmind.google/discover/blog/",      tier: 1, feed: "?" }
      - { nom: Google Developers Blog,url: "https://developers.googleblog.com",           tier: 1, feed: "?" }
      - { nom: Mistral AI News,       url: "https://mistral.ai/news",                     tier: 1, feed: "?" }
      - { nom: Meta AI Blog,          url: "https://ai.meta.com/blog/",                   tier: 1, feed: "?" }
      - { nom: Hugging Face Blog,     url: "https://huggingface.co/blog",                 tier: 1, feed: "?" }
      - { nom: NVIDIA Newsroom,       url: "https://nvidianews.nvidia.com",               tier: 1, feed: "?" }
    surveiller:
      - pages de tarification et de dépréciation des modèles (changements silencieux)
      - notes de version des SDK

  # ── B2 · Écosystème MCP & agentique ───────────────────────────
